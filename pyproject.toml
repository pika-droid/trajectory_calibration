[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trajectory_calibration"
version = "0.1.0"
description = "Trajectory Uncertainty Calibration for Multimodal Language Models (M3-LLaVA and MQT-LLaVA)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.1.2",
    "numpy<2.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "tqdm>=4.65.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "pillow>=9.5.0",
    "transformers>=4.38.0,<4.45.0",
    "datasets",
    "sentence-transformers<3.0.0",
    "evaluate",
    "rouge-score",
    "hf_transfer",
]

[project.optional-dependencies]
gpu = [
    "accelerate<1.0.0",
    "einops",
    "timm",
    "peft",
    "sentencepiece",
    "protobuf",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov",
    "black",
    "flake8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
norecursedirs = ["baseline_repo", ".venv", "build", "dist", "llava_src", "data", "results"]
